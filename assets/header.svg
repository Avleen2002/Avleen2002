<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Avleen Kaur Virdi, Software Developer. An animated black cat with big yellow eyes and a small white bird perched on its head." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D14"/>
      <stop offset="1" stop-color="#171A27"/>
    </linearGradient>
    <radialGradient id="warm" cx="780" cy="175" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8D5B7" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#C9B28A" stop-opacity=".10"/>
      <stop offset="1" stop-color="#E8D5B7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#E3DE7A"/>
      <stop offset="1" stop-color="#B9A9E6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B47"/>
      <stop offset="1" stop-color="#10121D"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    .tw    { animation: tw 3.6s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .12; } 50% { opacity: .95; } }

    .fade  { animation: fadein 1.1s ease-out both; }
    @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .cursor { animation: cur 1.1s steps(1) infinite; }
    @keyframes cur { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .head  { transform-origin: 780px 240px; animation: tilt 7s ease-in-out infinite; }
    @keyframes tilt { 0%,100% { transform: rotate(-1.8deg); } 50% { transform: rotate(1.8deg); } }

    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
    @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(.06); } }

    .glow  { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .22; } 50% { opacity: .5; } }

    .bird  { transform-origin: 780px 100px; animation: hop 6s ease-in-out infinite; }
    @keyframes hop {
      0%,68%,100% { transform: translateY(0) rotate(-3deg); }
      74%         { transform: translateY(-11px) rotate(3deg); }
      80%         { transform: translateY(0) rotate(3deg); }
      85%         { transform: translateY(-6px) rotate(-2deg); }
      91%         { transform: translateY(0) rotate(-3deg); }
    }

    .tail  { transform-origin: 878px 288px; animation: sway 4.5s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }

    .note  { opacity: 0; animation: rise 6s ease-out infinite; }
    @keyframes rise {
      0%,72% { opacity: 0; transform: translate(0,0); }
      78%    { opacity: 1; }
      100%   { opacity: 0; transform: translate(16px,-42px); }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#warm)"/>

    <!-- twinkling stars -->
    <g fill="#F3E6CF">
      <circle class="tw" cx="40"  cy="32"  r="1.4" style="animation-delay:0s"/>
      <circle class="tw" cx="118" cy="262" r="1.2" style="animation-delay:.8s"/>
      <circle class="tw" cx="190" cy="46"  r="1.6" style="animation-delay:1.6s"/>
      <circle class="tw" cx="262" cy="270" r="1.1" style="animation-delay:2.2s"/>
      <circle class="tw" cx="340" cy="30"  r="1.3" style="animation-delay:.4s"/>
      <circle class="tw" cx="420" cy="262" r="1.5" style="animation-delay:1.2s"/>
      <circle class="tw" cx="470" cy="60"  r="1.1" style="animation-delay:2.8s"/>
      <circle class="tw" cx="540" cy="24"  r="1.7" style="animation-delay:.2s"/>
      <circle class="tw" cx="585" cy="130" r="1.2" style="animation-delay:1.9s"/>
      <circle class="tw" cx="600" cy="250" r="1.3" style="animation-delay:3s"/>
      <circle class="tw" cx="640" cy="52"  r="1.0" style="animation-delay:.6s"/>
      <circle class="tw" cx="955" cy="40"  r="1.5" style="animation-delay:1.4s"/>
      <circle class="tw" cx="930" cy="120" r="1.1" style="animation-delay:2.4s"/>
      <circle class="tw" cx="972" cy="200" r="1.3" style="animation-delay:.9s"/>
      <circle class="tw" cx="640" cy="190" r="1.1" style="animation-delay:2s"/>
      <circle class="tw" cx="60"  cy="150" r="1.0" style="animation-delay:3.2s"/>
    </g>

    <!-- text -->
    <text class="fade" x="64" y="92" font-family="'Courier New', Consolas, monospace" font-size="14" letter-spacing="3" fill="#8A93B2" style="animation-delay:.1s">// HELLO, WORLD</text>
    <text class="fade" x="64" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#F3E6CF" style="animation-delay:.35s">Avleen Kaur Virdi</text>
    <rect class="fade" x="64" y="164" width="380" height="2" fill="url(#rule)" style="animation-delay:.6s"/>
    <text class="fade" x="64" y="200" font-family="'Courier New', Consolas, monospace" font-size="21" fill="#E3DE7A" style="animation-delay:.85s">Software Developer<tspan class="cursor" fill="#E3DE7A">_</tspan></text>
    <text class="fade" x="64" y="232" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#AEB6D6" style="animation-delay:1.1s">algorithms · systems · creative tech</text>

    <!-- cat -->
    <!-- tail (behind body) -->
    <g class="tail">
      <path d="M 878 288 C 950 290, 968 236, 934 204" fill="none" stroke="#151829" stroke-width="15" stroke-linecap="round"/>
    </g>

    <!-- body -->
    <path d="M 700 228 C 690 264 670 286 652 300 L 908 300 C 890 286 870 264 860 228 Z" fill="#12141F"/>
    <ellipse cx="852" cy="272" rx="42" ry="26" fill="#6B7A9E" opacity=".22"/>
    <ellipse cx="716" cy="276" rx="30" ry="20" fill="#E8D5B7" opacity=".08"/>

    <!-- head (tilts gently) -->
    <g class="head">
      <!-- soft warm halo behind the bird -->
      <circle class="glow" cx="780" cy="66" r="44" fill="#FFF3C4" filter="url(#blur)"/>

      <!-- ears -->
      <path d="M 700 130 L 688 58 L 762 102 Z" fill="#171A2B"/>
      <path d="M 706 120 L 698 78 L 746 104 Z" fill="#E8743B" opacity=".92"/>
      <path d="M 860 130 L 874 46 L 804 100 Z" fill="#171A2B"/>
      <path d="M 853 120 L 864 70 L 818 101 Z" fill="#2B3050"/>

      <!-- face -->
      <ellipse cx="780" cy="170" rx="97" ry="80" fill="url(#fur)"/>
      <path d="M 686 176 L 667 192 L 691 197 Z" fill="#161A2C"/>
      <path d="M 874 176 L 893 192 L 869 197 Z" fill="#161A2C"/>
      <path d="M 700 120 C 740 92 820 92 860 120" fill="none" stroke="#3B4262" stroke-width="2" opacity=".5" stroke-linecap="round"/>
      <ellipse cx="780" cy="199" rx="26" ry="15" fill="#1A1E30"/>

      <!-- eyes -->
      <g class="blink">
        <circle cx="743" cy="168" r="30" fill="#E3DE7A" opacity=".22" filter="url(#blur)"/>
        <circle cx="743" cy="168" r="24" fill="#E3DE7A"/>
        <circle cx="743" cy="168" r="24" fill="none" stroke="#B8B45A" stroke-width="2"/>
        <ellipse cx="745" cy="170" rx="12" ry="16" fill="#06070B"/>
        <circle cx="750" cy="162" r="5.2" fill="#FFFFFF"/>
        <circle cx="739" cy="178" r="2.4" fill="#FFFFFF" opacity=".85"/>
      </g>
      <g class="blink">
        <circle cx="817" cy="168" r="30" fill="#E3DE7A" opacity=".22" filter="url(#blur)"/>
        <circle cx="817" cy="168" r="24" fill="#E3DE7A"/>
        <circle cx="817" cy="168" r="24" fill="none" stroke="#B8B45A" stroke-width="2"/>
        <ellipse cx="819" cy="170" rx="12" ry="16" fill="#06070B"/>
        <circle cx="824" cy="162" r="5.2" fill="#FFFFFF"/>
        <circle cx="813" cy="178" r="2.4" fill="#FFFFFF" opacity=".85"/>
      </g>

      <!-- nose, mouth, whiskers -->
      <path d="M 771 191 Q 780 187 789 191 Q 786 199 780 200 Q 774 199 771 191 Z" fill="#B58FA8"/>
      <path d="M 780 200 L 780 206 M 780 206 Q 772 213 764 208 M 780 206 Q 788 213 796 208" fill="none" stroke="#3E4463" stroke-width="1.7" stroke-linecap="round"/>
      <g stroke="#AEB6D6" stroke-width="1.2" opacity=".55" stroke-linecap="round" fill="none">
        <path d="M 752 201 L 694 190"/>
        <path d="M 751 207 L 696 209"/>
        <path d="M 752 213 L 702 227"/>
        <path d="M 808 201 L 866 190"/>
        <path d="M 809 207 L 864 209"/>
        <path d="M 808 213 L 858 227"/>
      </g>

      <!-- bird -->
      <g class="bird">
        <path d="M 770 100 l -3 5 M 790 100 l 3 5" stroke="#E39A7B" stroke-width="2.2" stroke-linecap="round"/>
        <ellipse cx="780" cy="77" rx="23" ry="27" fill="#F6F1E7"/>
        <ellipse cx="781" cy="82" rx="13" ry="10" fill="#B9A9E6" opacity=".7"/>
        <path d="M 800 62 C 819 73 813 92 795 99 C 801 85 801 74 800 62 Z" fill="#E4DBCB"/>
        <circle cx="780" cy="49" r="17" fill="#FBF8F0"/>
        <path d="M 774 33 Q 780 24 787 33" fill="none" stroke="#FBF8F0" stroke-width="4" stroke-linecap="round"/>
        <circle cx="772" cy="47" r="3.2" fill="#0B0D14"/>
        <circle cx="788" cy="47" r="3.2" fill="#0B0D14"/>
        <circle cx="773" cy="46" r="1" fill="#FFFFFF"/>
        <circle cx="789" cy="46" r="1" fill="#FFFFFF"/>
        <path d="M 776 52 L 784 52 L 780 62 Z" fill="#F2C94C"/>
        <circle cx="767" cy="55" r="3.4" fill="#F0B9C4" opacity=".55"/>
        <circle cx="793" cy="55" r="3.4" fill="#F0B9C4" opacity=".55"/>
      </g>
    </g>

    <!-- floating notes -->
    <text class="note" x="822" y="92" font-family="Georgia, serif" font-size="18" fill="#E3DE7A" style="animation-delay:0s">♪</text>
    <text class="note" x="738" y="86" font-family="Georgia, serif" font-size="15" fill="#B9A9E6" style="animation-delay:.5s">♫</text>
  </g>

  <rect x=".5" y=".5" width="999" height="299" rx="18" fill="none" stroke="#E3DE7A" stroke-opacity=".2"/>
</svg>
